# End-to-end chat and assignment-context development with a candidate capacity provider.
# Use development.communication-rollout.session.yaml when provider behavior is out of scope.
schemaVersion: treeseed.development-selection/v1
projects:
  - manifest: packages/sdk/treeseed.package.yaml
    worktree: packages/sdk
    targets: [{ id: package, mode: live }]
  - manifest: packages/api/treeseed.package.yaml
    worktree: packages/api
    targets: [{ id: service, mode: live }, { id: operations-runner, mode: candidate }]
  - manifest: packages/cli/treeseed.package.yaml
    worktree: packages/cli
    targets: [{ id: package, mode: live }]
  - manifest: packages/agent/treeseed.package.yaml
    worktree: packages/agent
    targets: [{ id: provider, mode: candidate }]
