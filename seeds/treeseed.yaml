schemaVersion: treeseed.seed-bundle/v3
name: treeseed
version: 5
description: Portable first-party source inventory for integrated and selective development.
resources:
  projects:
    - { key: 'project:treeseed/platform', slug: platform, primaryRepository: 'repository:treeseed/platform' }
    - { key: 'project:treeseed/deployment', slug: deployment, primaryRepository: 'repository:treeseed/deployment' }
    - { key: 'project:treeseed/api', slug: api, primaryRepository: 'repository:treeseed/api' }
    - { key: 'project:treeseed/treedx', slug: treedx, primaryRepository: 'repository:treeseed/treedx' }
    - { key: 'project:treeseed/sdk', slug: sdk, primaryRepository: 'repository:treeseed/sdk' }
    - { key: 'project:treeseed/ui', slug: ui, primaryRepository: 'repository:treeseed/ui' }
    - { key: 'project:treeseed/cli', slug: cli, primaryRepository: 'repository:treeseed/cli' }
    - { key: 'project:treeseed/core', slug: core, primaryRepository: 'repository:treeseed/core' }
    - { key: 'project:treeseed/admin', slug: admin, primaryRepository: 'repository:treeseed/admin' }
    - { key: 'project:treeseed/agent', slug: agent, primaryRepository: 'repository:treeseed/agent' }
    - { key: 'project:treeseed/reviewer', slug: reviewer, primaryRepository: 'repository:treeseed/reviewer' }
    - { key: 'project:treeseed/template-engineering', slug: template-engineering, primaryRepository: 'repository:treeseed/template-engineering' }
    - { key: 'project:treeseed/template-research', slug: template-research, primaryRepository: 'repository:treeseed/template-research' }
    - { key: 'project:treeseed/market', slug: market, primaryRepository: 'repository:treeseed/market' }
    - { key: 'project:treeseed/market-api', slug: market-api, primaryRepository: 'repository:treeseed/market-api' }
    - { key: 'project:treeseed/skill', slug: skill, primaryRepository: 'repository:treeseed/skill' }
  repositories:
    - { key: 'repository:treeseed/platform', project: 'project:treeseed/platform', role: primary, gitUrl: 'https://github.com/treeseed-ai/platform.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/deployment', project: 'project:treeseed/deployment', role: primary, gitUrl: 'https://github.com/treeseed-ai/deployment.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/api', project: 'project:treeseed/api', role: primary, gitUrl: 'https://github.com/treeseed-ai/api.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/treedx', project: 'project:treeseed/treedx', role: primary, gitUrl: 'https://github.com/treeseed-ai/treedx.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/sdk', project: 'project:treeseed/sdk', role: primary, gitUrl: 'https://github.com/treeseed-ai/sdk.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/ui', project: 'project:treeseed/ui', role: primary, gitUrl: 'https://github.com/treeseed-ai/ui.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/cli', project: 'project:treeseed/cli', role: primary, gitUrl: 'https://github.com/treeseed-ai/cli.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/core', project: 'project:treeseed/core', role: primary, gitUrl: 'https://github.com/treeseed-ai/core.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/admin', project: 'project:treeseed/admin', role: primary, gitUrl: 'https://github.com/treeseed-ai/admin.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/agent', project: 'project:treeseed/agent', role: primary, gitUrl: 'https://github.com/treeseed-ai/agent.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/reviewer', project: 'project:treeseed/reviewer', role: primary, gitUrl: 'https://github.com/treeseed-ai/reviewer.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/template-engineering', project: 'project:treeseed/template-engineering', role: primary, gitUrl: 'https://github.com/treeseed-ai/template-engineering.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/template-research', project: 'project:treeseed/template-research', role: primary, gitUrl: 'https://github.com/treeseed-ai/template-research.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging } }
    - { key: 'repository:treeseed/market', project: 'project:treeseed/market', role: primary, gitUrl: 'https://github.com/treeseed-ai/market.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging }, metadata: { hostedDeploymentAuthority: external } }
    - { key: 'repository:treeseed/market-api', project: 'project:treeseed/market-api', role: primary, gitUrl: 'https://github.com/treeseed-ai/market-api.git', defaultBranch: main, repositoryPolicy: { stagingBranch: staging }, metadata: { hostedDeploymentAuthority: external } }
    - { key: 'repository:treeseed/skill', project: 'project:treeseed/skill', role: primary, gitUrl: 'https://github.com/treeseed-ai/skill.git', defaultBranch: main }
