schemaVersion: 3
ownership:
  type: team
  teamId: team:treeseed
configuration:
  generation: local-battery-v2
identity:
  privateKeyRef: data://identity-v3.json
  displayName: TreeSeed local capacity battery
capacity:
  maxConcurrentWorkers: 4
  cpuCores: 8
  memoryBytes: 17179869184
  maxActiveSeconds: 28800
  maxInputTokens: 4000000
  maxOutputTokens: 1000000
  maxCost: 100
  currency: USD
  maxAttempts: 3
credentialProfiles:
  - { id: codex-auth, source: process-environment, reference: TREESEED_CODEX_AUTH_FILE, required: true }
  - { id: codex-executable, source: process-environment, reference: TREESEED_CODEX_EXECUTABLE, required: true }
  - { id: platform-github, source: process-environment, reference: TREESEED_GITHUB_TOKEN, required: false }
  - { id: platform-cloudflare, source: process-environment, reference: TREESEED_CLOUDFLARE_API_TOKEN, required: false }
lanes:
  - id: communication
    purpose: communication
    priority: 100
    reservedConcurrentWorkers: 1
    maxConcurrentWorkers: 2
    borrowWhenIdle: true
    lendWhenIdle: true
    reclaimPolicy: admission
    queueLimit: 100
    timeoutSeconds: 120
    capabilities: [communication, agent-execution, research, planning]
  - id: platform
    purpose: platform
    priority: 70
    reservedConcurrentWorkers: 0
    maxConcurrentWorkers: 2
    borrowWhenIdle: true
    lendWhenIdle: true
    reclaimPolicy: admission
    queueLimit: 25
    timeoutSeconds: 900
    capabilities: [platform_operation, infrastructure_reconciliation, repository_reconciliation]
  - id: workday
    purpose: workday
    priority: 50
    reservedConcurrentWorkers: 0
    maxConcurrentWorkers: 4
    borrowWhenIdle: true
    lendWhenIdle: true
    reclaimPolicy: admission
    queueLimit: 100
    timeoutSeconds: 900
    minimumAssignmentDuration: { amount: 600, unit: seconds }
    capabilities: [agent-execution, engineering, research, planning, acting, verification, repository_work]
adapters:
  - id: codex-local
    adapter: codex
    isolation: process
    module: module:codex-chat
    profile: subscription
    protocol: responses
    credentialProfiles: [codex-auth, codex-executable]
    laneIds: [communication]
    maxConcurrentWorkers: 2
    minimumAssignmentDuration: { amount: 600, unit: seconds }
    nativeLimits: { availableAgentSeconds: 28800 }
    capabilities: [communication, agent-execution]
  - id: platform-local
    adapter: platform-operation
    isolation: process
    credentialProfiles: [platform-github, platform-cloudflare]
    laneIds: [platform]
    maxConcurrentWorkers: 2
    nativeLimits: { availableAgentSeconds: 14400 }
    capabilities: [platform_operation, infrastructure_reconciliation, repository_reconciliation]
connections: []
metadata:
  custody: local-only
  sharedBattery: true
