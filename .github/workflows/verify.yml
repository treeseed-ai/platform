name: Verify

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: treeseed-ai/cli/.github/actions/setup-cli@0.13.0-rc.89
        with: { version: 0.13.0-rc.89 }
      - name: Locate installed CLI SDK
        id: cli-sdk
        run: echo "path=$(npm root --global)/@treeseed/cli/node_modules/@treeseed/sdk" >> "$GITHUB_OUTPUT"
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@8e07d9adaf45ff75e9ea16de691b90d182aa30f8
        env:
          NODE_ENV: production
        with:
          commit: 83fa5a5d72ae827a70c7846a52b3b2b74fa50678
          github-token: ${{ github.token }}
          paths: ${{ steps.cli-sdk.outputs.path }}
      - run: trsd platform verify . --json
      - run: trsd platform verify . --profile core --json
      - run: trsd platform verify . --profile control-plane --profile capacity-provider --profile treeai --json
      - name: Verify exact project-scoped skill lock
        run: |
          workspace="$(mktemp -d)"
          cd "$workspace"
          git init --quiet
          npx --yes skills@1.5.23 add https://github.com/treeseed-ai/skill/tree/0.1.0-rc.1 --skill treeseed --agent codex --yes --copy
          cmp skills-lock.json "$GITHUB_WORKSPACE/skills-lock.json"
