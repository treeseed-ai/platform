name: Cordis composition verification
on:
  pull_request:
    branches: [cordis]
  push:
    branches: ['feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    env:
      CORDIS_REQUIRE_PLAN: ${{ matrix.runner == 'ubuntu-26.04' && '1' || '0' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Check out exact public CLI candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/cli
          ref: 36d9bd017284d4c8f34dec9da6656304f8e97c5c
          path: packages/cli
          persist-credentials: false
      - run: bun install --frozen-lockfile
        working-directory: packages/cli
      - run: bun run verify
        working-directory: packages/cli
      - name: Strictly type-check assembled verification
        run: bun node_modules/typescript/bin/tsc --strict --noEmit --module nodenext --target es2022 --skipLibCheck --typeRoots node_modules/@types --types node ../../tests/task1-composition.test.mts ../../tests/task2-planning.test.mts
        working-directory: packages/cli
      - run: node --test --test-concurrency=1 tests/skills/*.test.mts tests/task1-composition.test.mts tests/task2-planning.test.mts
