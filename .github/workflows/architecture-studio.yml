name: Architecture Studio
on:
  pull_request:
    branches: [cordis]
  push:
    branches: ['feature/**', 'fix/**', 'codex/**']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STUDIO_TEST_FILES: |
        tests/acceptance/architecture-studio/studio.test.ts
        tests/integration/architecture-studio/refresh.test.ts
        tests/integration/architecture-studio/security.test.ts
        tests/integration/architecture-studio/source.test.ts
        tests/integration/architecture-studio/workspace.test.ts
        tests/unit/architecture-studio/authoring.test.ts
        tests/unit/architecture-studio/language.test.ts
        tests/unit/architecture-studio/migration.test.ts
        tests/unit/architecture-studio/semantics.test.ts
    defaults:
      run:
        working-directory: architecture/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: architecture/studio/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
