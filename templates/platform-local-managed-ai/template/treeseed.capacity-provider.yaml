      - communication
      - agent-execution
      - research
      - planning
  - id: platform
    purpose: platform
    priority: 70
    reservedConcurrentWorkers: 0
    maxConcurrentWorkers: 4
    borrowWhenIdle: true
    lendWhenIdle: true
    reclaimPolicy: admission
    queueLimit: 100
    timeoutSeconds: 900
