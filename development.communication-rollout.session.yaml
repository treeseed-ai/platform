# Communication control-plane development without replacing the released capacity provider.
# Use development.chat-context.session.yaml when provider behavior is part of the test.
schemaVersion: treeseed.development-selection/v1
projects:
  - manifest: packages/sdk/treeseed.package.yaml
    worktree: packages/sdk
    targets:
      - { id: package, mode: live }
  - manifest: packages/api/treeseed.package.yaml
    worktree: packages/api
    targets:
      - { id: service, mode: live }
      - { id: operations-runner, mode: candidate }
  - manifest: packages/cli/treeseed.package.yaml
    worktree: packages/cli
    targets:
      - { id: package, mode: live }
  - manifest: packages/agent/treeseed.package.yaml
    worktree: packages/agent
    targets:
      - { id: provider, mode: released }
