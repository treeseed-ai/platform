- id: agent.flow.cancellation
  kind: flow
  name: Cancellation and authority failure
  purpose: 'Required architecture: Cancellation and authority denial prevent successful results'
  participants:
  - agent.execution
  entry: entry
  nodes:
  - id: entry
    kind: entry
    description: Observe abort or authority failure
    next: cancel
  - id: cancel
    kind: cancel
    description: Abort controller/checkpoint stops further admitted effects
    next: cleanup
  - id: cleanup
    kind: cleanup
    description: Release acquired leases and relay; cleanup may fail
    outcomes:
      disposed: outcome
      failed: recovery
  - id: outcome
    kind: complete
    description: Return cancelled for abort, blocked for denied authority
  - id: recovery
    kind: failure
    description: Failed release returns recovery-required
  outcomes:
  - outcome
  - recovery
  requiredCleanup:
  - cleanup
- id: agent.flow.capacity
  kind: flow
  name: Capacity service coordination
  purpose: 'Required architecture: Known manager, worker and guest boundaries; assembled dispatch linkage is unverified'
  participants:
  - agent.manager
  - agent.worker
  - agent.guest
  entry: entry
  nodes:
  - id: entry
    kind: entry
    description: Manager validates registration/proof and readiness
    next: worker
  - id: worker
    kind: message
    description: Require manager-to-worker assignment through versioned capacity channel contract
    participant: agent.worker
    contract: agent.contract.worker
    next: guest
  - id: guest
    kind: message
    description: Require worker-to-guest dispatch through runner contract with pinned authority and generation
    participant: agent.guest
    contract: agent.contract.guest
    next: cleanup
  - id: cleanup
    kind: cleanup
    description: Guest releases leases; host destruction requires owner evidence
    outcomes:
      verified: completed
      failed: recovery
  - id: completed
    kind: complete
    description: Require verified teardown and generation-bound result before success
  - id: recovery
    kind: failure
    description: Quarantine/fence resources and return recovery-required
  outcomes:
  - completed
  - recovery
  requiredCleanup:
  - cleanup
  extensions:
    architecture:partialFlow: Intended high-level boundaries; admission rejection, retries and cancellation refinement remain unspecified. Do not claim all-path completeness.
- id: agent.flow.cleanup-failure
  kind: flow
  name: Failed cleanup and fencing
  purpose: 'Required architecture: Failure to release invalidates application readiness'
  participants:
  - agent.execution
  entry: entry
  nodes:
  - id: entry
    kind: entry
    description: Lease release throws
    next: fence
  - id: fence
    kind: call
    description: Set recovery-required, clear output, record cleanup blocker, fence scope
    participant: agent.execution
    contract: agent.contract.application
    next: recovery
  - id: recovery
    kind: failure
    description: Return recovery-required; later admission is closed
  outcomes:
  - recovery
  requiredCleanup: []
- id: agent.flow.execution
  kind: flow
  name: Execution and cleanup
  purpose: 'Required architecture: Observed execution orchestration with repeated authority checkpoints'
  participants:
  - agent.execution
  - agent.plugin.AgentContextPlugin
  - agent.plugin.AgentEchoHandlerPlugin
  - agent.plugin.AgentEchoToolPlugin
  - agent.plugin.AgentReporterPlugin
  - agent.plugin.AgentExecutionPlugin
  entry: entry
  nodes:
  - id: entry
    kind: entry
    description: Validate admission/generation and acquire host lease
    next: context
  - id: context
    kind: call
    description: Load context and require unchanged request after authority checkpoint
    participant: agent.plugin.AgentContextPlugin
    contract: agent.contract.agent.context
    outcomes:
      success: handler
      error: blocked
      cancelled: cancelled
  - id: handler
    kind: call
    description: Dispatch probe handler through selected tool
    participant: agent.plugin.AgentEchoHandlerPlugin
    contract: agent.contract.agent.handler
    outcomes:
      success: report
      error: blocked
      cancelled: cancelled
  - id: report
    kind: call
    description: Record execution identity after authority checkpoint
    participant: agent.plugin.AgentReporterPlugin
    contract: agent.contract.agent.reporting
    outcomes:
      success: cleanup
      error: blocked
      cancelled: cancelled
  - id: cleanup
    kind: cleanup
    description: Release child/host leases and cancellation relay; failure enters recovery-required
    outcomes:
      disposed: outcome
      failed: recovery
  - id: completed
    kind: complete
    description: Return validated result after successful disposal
  - id: blocked
    kind: failure
    description: Provider/authority failure; proceeds through cleanup
    next: cleanup
  - id: recovery
    kind: failure
    description: Cleanup failure fences application and suppresses output
  - id: cancelled
    kind: cancel
    description: Retain cancelled outcome and clear output
    next: cleanup
  - id: outcome
    kind: branch
    predicate: execution-state
    description: Return the retained result state, never convert a failure to success
    outcomes:
      completed: completed
      blocked: blocked-result
      cancelled: cancelled-result
  - id: blocked-result
    kind: complete
    description: Return blocked with no output after disposed cleanup
  - id: cancelled-result
    kind: complete
    description: Return cancelled with no output after disposed cleanup
  outcomes:
  - completed
  - blocked-result
  - cancelled-result
  - recovery
  requiredCleanup:
  - cleanup
  predicates:
  - id: execution-state
    description: Retained ExecutionOutcome.state after executionFailure and lease cleanup
- id: agent.flow.startup
  kind: flow
  name: Agent startup
  purpose: 'Required architecture: Observed default startup sequence; failures reject before returning ready application'
  participants:
  - agent.execution
  entry: entry
  nodes:
  - id: entry
    kind: entry
    description: Receive authority binding and configuration
    next: validate
  - id: validate
    kind: call
    description: Parse binding and private authority record, require granted state and exact identity
    participant: agent.execution
    contract: agent.contract.application
    outcomes:
      success: select
      error: rejected
  - id: select
    kind: call
    description: Construct defaults, validate overrides and select providers
    participant: agent.execution
    contract: agent.contract.application
    outcomes:
      success: mount
      error: rejected
  - id: mount
    kind: call
    description: Start native CordisScope and await startup
    participant: agent.execution
    contract: agent.contract.application
    outcomes:
      success: ready
      error: rejected
  - id: ready
    kind: complete
    description: Return application after successful start
  - id: rejected
    kind: failure
    description: Parsing, authority or composition failure rejects startup
  outcomes:
  - ready
  - rejected
  requiredCleanup: []
